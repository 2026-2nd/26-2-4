# 목표 변수 y: 셀(단지×전용면적)의 서울 대비 상대 가격 변화, 로그 차이 ×100 (%p)
# 설명: docs/methodology.md 2단계 · 예시 구현: src/regime/pilot_location_vs_features.py
cell:
  key: [자치구, 법정동, 번지, 단지명]
  area_rounding_m2: 1
index_for_time_adjustment: main          # data/regime/seoul_index_2017_2026.csv
window:                                   # 주 분석
  half_width_months: 3
  half_width_months_by_regime: {corr: 2}  # ±3이면 2019-01에서 겹침
  first_start_window: [2017-01, 2017-04]  # 상승기① 시작 창
  last_end_window: [2026-05, 2026-10]     # 상승기③ 끝 창
  statistic: median
  weight: min(시작 창 거래 수, 끝 창 거래 수)
slope:                                    # 표본 확장·강건성
  period: [a - k, b + k]                  # k = window 폭
  min_trades: 2
  min_span_months: 6
  y: slope_per_month * L
  weight: 거래 수와 간격에 비례
exclude_trades:
  - 좌표 없음(결측사유 '주소 소실 추정')
  - 연식_기준 == '준공 전 거래'
expected_cells:                           # 실제 계산값(v4 기준). 재계산 시 비교
  window: {up1: 5950, corr: 4630, up2: 4460, down: 2883, rec: 3483, up3: 5660}
  slope:  {up1: 10538, corr: 4456, up2: 11820, down: 4359, rec: 6556, up3: 10206}
