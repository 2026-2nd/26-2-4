name: V3 nested group CV
on:
  workflow_dispatch:
  push:
    branches: ['model/training']
    paths:
      - 'src/model/nested_v3.py'
      - '.github/workflows/nested-v3.yml'
      - 'tests/test_nested_v3.py'
permissions:
  contents: read
env:
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python tools/verify_final.py
      - run: python -m pytest -q tests/test_nested_v3.py
      - run: python src/model/nested_v3.py build
      - uses: actions/upload-artifact@v4
        with:
          name: v3-train-inputs
          path: results/nested_v3/
          if-no-files-found: error
  evaluate:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        table: [up1_window, up1_slope, corr_window, corr_slope, up2_window, up2_slope, down_window, down_slope, rec_window, rec_slope, up3_window, up3_slope]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: v3-train-inputs
          path: results/nested_v3
      - run: python src/model/nested_v3.py evaluate --table ${{ matrix.table }}
      - uses: actions/upload-artifact@v4
        with:
          name: v3-${{ matrix.table }}
          path: results/nested_v3/evaluation/${{ matrix.table }}/
          if-no-files-found: error
  summary:
    needs: evaluate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: v3-*
          path: artifacts
      - name: Aggregate
        run: |
          python - <<'PY'
          import csv, pathlib
          paths=sorted(pathlib.Path('artifacts').rglob('metrics.csv'))
          assert len(paths)==12, paths
          rows=[]
          for p in paths:
              with p.open(encoding='utf-8-sig') as f:
                  rows.extend(csv.DictReader(f))
          assert len(rows)==72
          with open('nested_metrics.csv','w',encoding='utf-8-sig',newline='') as f:
              w=csv.DictWriter(f,fieldnames=list(rows[0]))
              w.writeheader()
              w.writerows(rows)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: v3-summary
          path: nested_metrics.csv
          if-no-files-found: error
